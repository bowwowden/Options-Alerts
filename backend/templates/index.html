<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📈 Stock Alerts Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Helper Mascot -->
    <img id="helper"
         src="{{ url_for('static', filename='horseshoe.png') }}"
         alt="Helper"
         class="fixed bottom-6 right-6 w-28 h-28 cursor-pointer z-50 transition-transform hover:scale-110">

    <!-- Chat Bubble -->
    <div id="chat-bubble"
         class="hidden fixed bottom-36 right-10 bg-white shadow-lg rounded-2xl p-4 max-w-xs text-sm text-gray-800 border border-gray-200 z-50">
      <p id="chat-text">Hey there! 👋 Need help checking an alert?</p>
      <button id="close-chat" class="mt-2 text-blue-500 text-xs hover:underline">Close</button>

     <button id="open-chat" class="text-blue-500 text-xs hover:underline">Yes</button>
    </div>


    <script>
    const helper = document.getElementById('helper');
    const chat = document.getElementById('chat-bubble');
    const close = document.getElementById('close-chat');
    const open = document.getElementById('open-chat');

    helper.addEventListener('click', () => {
    chat.classList.toggle('hidden');
    });

    close.addEventListener('click', () => {
    chat.classList.add('hidden');
    });

    open.addEventListener('click', () => {
    document.getElementById('chat-text').innerText = "Awesome! 🚀 Let's check the latest alerts together!";
    open.style.display = "none";
    });
    </script>


  <div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4 text-center">📢 Stock Alerts</h1>

    <div class="space-y-3 overflow-y-auto h-[80vh]">
      {% for alert in alerts %}
      <div class="bg-white p-4 rounded-xl shadow hover:shadow-md transition">
        <div class="flex justify-between items-center mb-2">
          <h2 class="font-semibold text-lg">{{ alert.symbol }} {{ alert.type | capitalize }}</h2>
          <span class="text-sm text-gray-500">{{ alert.expiration }}</span>
        </div>
        <p class="text-gray-700 mb-1">💰 Price: {{ alert.price }}</p>
        {% if alert.change %}
        <p class="text-sm {% if alert.change >= 0 %}text-green-500{% else %}text-red-500{% endif %}">
          📊 {{ alert.change }}%
        </p>
        {% endif %}
        <p class="text-gray-600 text-sm">{{ alert.detail }}</p>
      </div>
      {% endfor %}
    </div>

    <footer class="text-center text-xs text-gray-400 mt-4">
      <a href="/about" class="text-blue-500 hover:underline">About</a>
    </footer>
  </div>
</body>
</html>
